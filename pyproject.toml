[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "spheropack"
dynamic = ["version"]
description = "Random sphere packings with the event-driven Lubachevsky-Stillinger algorithm, and rejection-free Monte Carlo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Peters", email = "e.a.j.f.peters@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["sphere packing", "random close packing", "Lubachevsky-Stillinger", "event-driven", "hard spheres", "Monte Carlo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib", "pyvista"]

[project.scripts]
spheropack = "spheropack.cli:main"

[project.urls]
Homepage = "https://computational-chemical-engineering.github.io/spheropack"
Documentation = "https://computational-chemical-engineering.github.io/spheropack"
Repository = "https://github.com/computational-chemical-engineering/spheropack"
Issues = "https://github.com/computational-chemical-engineering/spheropack/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["python/spheropack"]
sdist.exclude = ["tests/baselines/*.json", ".github", "docs/notebooks", "docs/_build", "CLAUDE.md"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/spheropack/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical tests that take minutes (run nightly)"]
addopts = "-m 'not slow'"

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*", "*-win32", "*-manylinux_i686"]
test-extras = ["test"]
test-command = "pytest {project}/tests"
build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# nanobind needs aligned allocation (macOS 10.13+); C++20 library support from 10.15.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
