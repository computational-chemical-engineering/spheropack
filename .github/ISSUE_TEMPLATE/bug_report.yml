name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal example
      description: Code that reproduces the problem, with the seed if the result depends on it.
      render: python
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `python -c "import spheropack, sys, platform; print(spheropack.__version__, sys.version, platform.platform())"`
    validations:
      required: true
